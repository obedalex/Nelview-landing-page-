      <h2 style={{margin:0,fontSize:108,lineHeight:.98,letterSpacing:'-.055em',fontWeight:700,color:'#14231B',maxWidth:'none'}}>Your ultimate<br/><span style={{color:'#15803D',whiteSpace:'nowrap'}}>pre&#8209;submission audit.</span></h2>
      <div style={{display:'flex',alignItems:'center',gap:18,marginTop:8}}><span style={{background:'#1BB35C',color:'#fff',fontSize:32,fontWeight:600,padding:'18px 34px',borderRadius:18}}>Join the waitlist</span><span style={{fontSize:32,color:'#3E4A42',fontWeight:550}}>nelview.com</span></div>
    </div>
  </div>;
}
function EmbedControls(){
  const [,force]=React.useState(0);const [hover,setHover]=React.useState(true);const [muted,setMuted]=React.useState(true);const bar=React.useRef(null),hideT=React.useRef(null);
  React.useEffect(()=>{const f=()=>force(n=>n+1);window.addEventListener('omctl',f);return()=>window.removeEventListener('omctl',f)},[]);
  React.useEffect(()=>{window.__embedMuted=muted},[muted]);
  const c=window.__omCtl;if(!c)return null;
  const poke=()=>{setHover(true);clearTimeout(hideT.current);hideT.current=setTimeout(()=>setHover(false),2200)};
  const seekAt=e=>{const r=bar.current.getBoundingClientRect();c.seek(clamp((e.clientX-r.left)/r.width,0,1)*c.duration)};
  const drag=e=>{seekAt(e);const mv=ev=>seekAt(ev),up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)};
  const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  const show=hover||!c.playing,pct=100*c.time/c.duration;
  const B={width:36,height:36,borderRadius:18,border:0,background:'transparent',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0};
  return <div onPointerMove={poke} onPointerLeave={()=>setHover(false)} style={{position:'fixed',inset:0,zIndex:50,fontFamily:"'Geist',system-ui,sans-serif"}}>
    <div onClick={()=>{c.toggle();poke()}} style={{position:'absolute',inset:0,cursor:'pointer'}}/>
    {!c.playing&&<button onClick={()=>c.play()} aria-label="Play" style={{position:'absolute',left:'50%',top:'50%',width:76,height:76,margin:'-38px 0 0 -38px',borderRadius:38,border:'1px solid rgba(255,255,255,.5)',background:'rgba(15,59,42,.72)',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 20px 40px -16px rgba(0,0,0,.4)'}}><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>}
    <div style={{position:'absolute',left:14,right:14,bottom:14,height:48,borderRadius:16,background:'rgba(14,20,17,.62)',backdropFilter:'blur(16px) saturate(1.4)',WebkitBackdropFilter:'blur(16px) saturate(1.4)',border:'1px solid rgba(255,255,255,.14)',display:'flex',alignItems:'center',gap:6,padding:'0 8px',opacity:show?1:0,transform:`translateY(${show?0:10}px)`,transition:'opacity .25s,transform .25s',pointerEvents:show?'auto':'none'}}>
      <button style={B} aria-label={c.playing?'Pause':'Play'} onClick={()=>c.toggle()}>{c.playing?<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>:<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>}</button>
      <button style={B} aria-label="Restart" onClick={()=>{c.seek(0);c.play()}}><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <span style={{color:'#fff',fontSize:13,fontVariantNumeric:'tabular-nums',minWidth:34,textAlign:'right'}}>{fmt(c.time)}</span>
      <div ref={bar} onPointerDown={drag} style={{flex:1,height:24,display:'flex',alignItems:'center',cursor:'pointer',margin:'0 6px'}}><div style={{position:'relative',width:'100%',height:5,borderRadius:3,background:'rgba(255,255,255,.22)'}}><div style={{position:'absolute',left:0,top:0,bottom:0,width:pct+'%',borderRadius:3,background:'#1BB35C'}}/><div style={{position:'absolute',left:pct+'%',top:'50%',width:13,height:13,margin:'-6.5px 0 0 -6.5px',borderRadius:7,background:'#fff',boxShadow:'0 1px 4px rgba(0,0,0,.4)'}}/></div></div>
      <span style={{color:'rgba(255,255,255,.7)',fontSize:13,fontVariantNumeric:'tabular-nums',minWidth:34}}>{fmt(c.duration)}</span>
      <button style={B} aria-label={muted?'Unmute':'Mute'} onClick={()=>setMuted(m=>!m)}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff"/>{muted?<><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></>:<><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></>}</svg></button>
      <a style={{...B,textDecoration:'none'}} aria-label="Open full screen" href="Nelview%20Mobile%20Demo.html" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></a>
    </div>
  </div>;
}
function App(){const [t,setTweak]=useTweaks(window.TWEAK_DEFAULTS);window.__dynColor=t.dynamicColor!==false;window.__solidBg=t.backdrop==='Solid';window.__sound=t.sound!==false;
  return <><CompositionStage width={W} height={H} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK} bg="#F4F5F6" motionEditor={t.motionEditor}><Piece/></CompositionStage>{window.__omEmbed&&<EmbedControls/>}
  <TweaksPanel><TweakSection label="Video"/><TweakToggle label="Sound" value={t.sound!==false} onChange={v=>setTweak('sound',v)}/><TweakRadio label="Backdrop" value={t.backdrop||'Blend'} options={['Solid','Blend']} onChange={v=>setTweak('backdrop',v)}/><TweakToggle label="Dynamic scene colors" value={t.dynamicColor!==false} onChange={v=>setTweak('dynamicColor',v)}/><TweakToggle label="Motion editor" value={t.motionEditor} onChange={v=>setTweak('motionEditor',v)}/></TweaksPanel></>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
